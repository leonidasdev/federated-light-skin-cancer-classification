# =============================================================================
# DSCATNet Centralized Training Configuration - PAD-UFES-20
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode centralized --config configs/dscatnet_centralized_padufes20.yaml
#
# Description:
#   Centralized (non-federated) training baseline on PAD-UFES-20 for direct
#   PAD-UFES-20 contains Brazilian clinical skin lesion images (~2.3k images).
#   Serves as the upper-bound performance baseline with pooled data.
#
# =============================================================================

centralized:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: dscatnet_centralized_padufes20
    description: "Centralized baseline training on PAD-UFES-20"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs
  datasets:
    - PAD-UFES-20

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: small
    image_size: 224
    num_classes: 7
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 4
    lr: 0.001
    weight_decay: 0.01
    epochs: 100
    warmup_epochs: 0
    scheduler: cosine
    min_lr: 0.000001

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Data Splits
  # ---------------------------------------------------------------------------
  splits:
    val_split: 0.15
    test_split: 0.15

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 5
    early_stopping_patience: 15
    use_class_weights: true
