# =============================================================================
# DSCATNet Federated Learning Configuration - HAM10000 (Non-IID)
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode federated --config configs/dscatnet_federated_ham10000_non_iid.yaml
#
# Description:
#   Federated learning on HAM10000 with Dirichlet heterogeneous distribution
#
# =============================================================================

federated:
  experiment:
    name: dscatnet_federated_ham10000_non_iid
    description: FL training on HAM10000 with FedAvg (non-IID)
  data_root: ./data
  output_dir: ./outputs
  datasets:
  - HAM10000
  model:
    name: DSCATNet
    variant: paper
    image_size: 224
    num_classes: 7
    pretrained: true
  training:
    batch_size: 4
    gradient_accumulation_steps: 8
    optimizer: adam
    lr: 0.001
    weight_decay: 0.0
    local_epochs: 1
    num_rounds: 100
    train_val_split: 0.85
  federation:
    num_clients: 4
    aggregation: FedAvg
    participation: 1.0
    data_partition_type: dirichlet     # Dirichlet(alpha=0.5): heterogeneous class distribution
  augmentation:
    level: none
    use_dermoscopy_norm: false
  evaluation:
    checkpoint_interval: 1
    early_stopping_patience: 100
    use_class_weights: false
    max_grad_norm: null
