# =============================================================================
# Experiment Configuration Template
# =============================================================================
#
# Description:
#   Template for creating new experiment configurations centralized and federated.
#   Copy this file and modify values as needed.
#
# Usage:
#   python run_experiment.py --config configs/my_experiment.yaml
#
# Validation:
#   python src/utils/config_schema.py configs/my_experiment.yaml --type experiment
#
# =============================================================================

# -----------------------------------------------------------------------------
# Experiment Metadata
# -----------------------------------------------------------------------------
experiment:
  name: "my-experiment"           # Unique experiment name (no spaces)
  description: "Experiment description"
  seed: 42                        # Random seed for reproducibility

# -----------------------------------------------------------------------------
# Hardware Settings
# -----------------------------------------------------------------------------
hardware:
  device: cuda                    # Options: cuda, cpu
  num_workers: 2                  # DataLoader workers (0-16)
  pin_memory: true                # Pin memory for faster GPU transfer
  mixed_precision: true           # Enable AMP for faster training

# -----------------------------------------------------------------------------
# Data Configuration
# -----------------------------------------------------------------------------
data:
  root_dir: ./data                # Path to data directory
  img_size: 224                   # Image size (32-512)
  val_split: 0.15                 # Validation split (0.0-0.5)
  test_split: 0.15                # Test split (0.0-0.5)
  
  # Preprocessing Options
  normalization: imagenet         # Options: imagenet, dermoscopy
  augmentation_level: none      # Options: none, light, medium, heavy
  
  # Classification Settings
  classification_mode: multiclass # Options: multiclass, multiclass_8, binary
  num_classes: 7                  # Number of classes (2-10)
  filter_unknown: true            # Filter UNK labels from datasets
  
  # Class Imbalance Handling
  use_weighted_sampling: false    # WeightedRandomSampler
  use_class_weights: false         # Class weights in loss function

# -----------------------------------------------------------------------------
# Centralized Training Baseline
# -----------------------------------------------------------------------------
centralized:
  epochs: 200                     # Training epochs (1-1000)
  batch_size: 4                   # Batch size (1-256)
  learning_rate: 0.001            # Learning rate (>0, <=1.0)
  weight_decay: 0.0               # L2 regularization (>=0, <=1.0)
  early_stopping_patience: 200    # Early stopping patience (1-1000)
  gradient_accumulation_steps: 8  # Gradient accumulation steps
  pooled_data: true               # Combine all datasets

# -----------------------------------------------------------------------------
# Federated Experiments
# -----------------------------------------------------------------------------
federated_experiments:
  # Add your federated experiments here
  - name: experiment_1
    description: "First experiment configuration"
    num_rounds: 100               # FL rounds (1-1000)
    local_epochs: 1               # Local training epochs (1-50)
    batch_size: 4                 # Local batch size (1-256)
    noniid_type: natural          # Options: natural, dirichlet, label_skew
    # dirichlet_alpha: 0.5        # Only for dirichlet type (>0)

# -----------------------------------------------------------------------------
# Evaluation Metrics
# -----------------------------------------------------------------------------
metrics:
  classification:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1_score
    - auc_roc
    - confusion_matrix
  federated:
    - convergence_rounds
    - communication_cost
    - client_drift
    - round_time
  per_class:
    - sensitivity
    - specificity

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging:
  log_dir: ./logs                 # Log directory
  checkpoint_dir: ./checkpoints   # Checkpoint directory
  tensorboard: true               # Enable TensorBoard logging
  wandb:
    enabled: false                # Enable W&B logging
    project: dscatnet-fl          # W&B project name
    entity: null                  # W&B entity (username/team)

# -----------------------------------------------------------------------------
# Reproducibility Settings
# -----------------------------------------------------------------------------
reproducibility:
  deterministic: true             # Use deterministic algorithms
  benchmark: false                # Use cuDNN benchmark mode
  seed: 42                        # Global random seed
