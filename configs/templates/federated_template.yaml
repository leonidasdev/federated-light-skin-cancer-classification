# =============================================================================
# Federated Learning Configuration Template
# =============================================================================
#
# Description:
#   Template for creating federated learning configurations.
#   Copy this file and modify values as needed.
#
# Usage:
#   python run_experiment.py --mode federated --config configs/my_fl_config.yaml
#
# Validation:
#   python src/utils/config_schema.py configs/my_fl_config.yaml --type federated
#
# =============================================================================

federated:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: my-federated-experiment
    description: "FL training on selected datasets with FedAvg"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs
  datasets:
    - HAM10000
    - ISIC2018

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: paper
    image_size: 224
    num_classes: 7
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 4
    gradient_accumulation_steps: 8
    optimizer: adam
    lr: 0.001
    weight_decay: 0.0
    local_epochs: 1
    num_rounds: 100
    train_val_split: 0.85

  # ---------------------------------------------------------------------------
  # Federation Configuration
  # ---------------------------------------------------------------------------
  federation:
    num_clients: 4
    aggregation: FedAvg
    participation: 1.0
    data_partition_type: iid     # Options: iid, natural, dirichlet, label_skew, quantity_skew

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 1
    early_stopping_patience: 100
    use_class_weights: false
    max_grad_norm: null

# =============================================================================
# Data Partition Type Reference
# =============================================================================
#
# The 'data_partition_type' field determines how FL data is distributed:
#
#   iid           - True IID: all data pooled then uniformly distributed (benchmark)
#   natural       - Each client gets its own dataset (dataset heterogeneity)
#   dirichlet     - Dirichlet-sampled class heterogeneity (alpha=0.5 recommended)
#   label_skew    - Class imbalance across clients
#   quantity_skew - Client size imbalance (unequal data amounts per client)
#
# =============================================================================
#
# Paper-Aligned Settings (DSCATNet, Yadav et al., PLOS ONE 2024):
#
#   training:
#     optimizer: adam, lr: 0.001, weight_decay: 0.0
#     batch_size: 4, gradient_accumulation_steps: 8  (effective BS = 32)
#     local_epochs: 1, num_rounds: 100
#
#   evaluation:
#     checkpoint_interval: 1, early_stopping_patience: 100
#     use_class_weights: false
#     max_grad_norm: null
#
#   augmentation:
#     HAM10000/ISIC*: level: none   (no augmentation)
#     PAD-UFES-20:    level: light  (horizontal/vertical flips)
#
# ============================================================================
