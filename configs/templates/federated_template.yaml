# =============================================================================
# Federated Learning Configuration Template
# =============================================================================
#
# Description:
#   Template for creating federated learning configurations.
#   Copy this file and modify values as needed.
#
# Usage:
#   python run_fl.py --config configs/my_fl_config.yaml
#
# Validation:
#   python src/utils/config_schema.py configs/my_fl_config.yaml --type federated
#
# =============================================================================

federated:
  # ---------------------------------------------------------------------------
  # Framework Settings
  # ---------------------------------------------------------------------------
  framework: flower               # FL framework (currently only 'flower')
  strategy: FedAvg                # Options: FedAvg, FedProx, FedNova
  
  # ---------------------------------------------------------------------------
  # Client Configuration
  # ---------------------------------------------------------------------------
  num_clients: 4                  # Number of clients (1-100)
  
  # Optional: Define specific clients (for natural non-IID)
  clients:
    - id: 1
      dataset: HAM10000
      description: "Client 1 description"
    - id: 2
      dataset: ISIC2018
      description: "Client 2 description"
    # Add more clients as needed
  
  # ---------------------------------------------------------------------------
  # Training Rounds
  # ---------------------------------------------------------------------------
  num_rounds: 100                 # FL rounds (1-1000)
  early_stopping_patience: 20     # Stop if no improvement (1-100)
  
  # ---------------------------------------------------------------------------
  # Client Participation
  # ---------------------------------------------------------------------------
  fraction_fit: 1.0               # Fraction of clients for training (0-1)
  fraction_evaluate: 1.0          # Fraction of clients for evaluation (0-1)
  min_fit_clients: 4              # Minimum clients for training (>=1)
  min_evaluate_clients: 4         # Minimum clients for evaluation (>=1)
  min_available_clients: 4        # Minimum available clients (>=1)
  
  # ---------------------------------------------------------------------------
  # Local Training
  # ---------------------------------------------------------------------------
  local_epochs: 3                 # Local epochs per round (1-50)
  local_batch_size: 8             # Local batch size (1-256)
  train_val_split: 0.15           # Local validation split (0-0.5)
  
  # ---------------------------------------------------------------------------
  # Optimizer Configuration
  # ---------------------------------------------------------------------------
  optimizer: Adam                 # Options: Adam, AdamW, SGD
  learning_rate: 0.001            # Learning rate (>0, <=1.0)
  weight_decay: 0.0001            # L2 regularization (>=0, <=1.0)
  
  # ---------------------------------------------------------------------------
  # Learning Rate Schedule
  # ---------------------------------------------------------------------------
  lr_scheduler: cosine            # Options: cosine, step, plateau, none
  warmup_epochs: 5                # Warmup epochs (0-50)
  min_lr: 0.000001                # Minimum learning rate (>=0, <=1.0)
  
  # ---------------------------------------------------------------------------
  # Communication & Checkpointing
  # ---------------------------------------------------------------------------
  save_every_rounds: 10           # Checkpoint frequency (1-100)
  evaluate_every_rounds: 1        # Evaluation frequency (1-100)
  
  # ---------------------------------------------------------------------------
  # Server Settings
  # ---------------------------------------------------------------------------
  server_address: "[::]:8080"     # Server address for distributed mode

# =============================================================================
# Data Distribution Scenarios
# =============================================================================
scenarios:
  natural_noniid:
    description: "Each client uses its own dataset"
    noniid_type: natural
    
  iid_pooled:
    description: "All datasets pooled and uniformly distributed"
    noniid_type: dirichlet
    dirichlet_alpha: 1000         # High alpha ≈ IID
    
  moderate_noniid:
    description: "Dirichlet distribution with alpha=0.5"
    noniid_type: dirichlet
    dirichlet_alpha: 0.5
    
  extreme_noniid:
    description: "Dirichlet distribution with alpha=0.1"
    noniid_type: dirichlet
    dirichlet_alpha: 0.1

# =============================================================================
# Aggregation Strategies
# =============================================================================
strategies:
  - name: FedAvg
    description: "Federated Averaging - weighted by sample count"
    
  - name: FedProx
    description: "FedAvg with proximal term for heterogeneous data"
    mu: 0.01                      # Proximal term coefficient
    
  - name: FedNova
    description: "Normalized averaging accounting for local steps"
