# =============================================================================
# DSCATNet Federated Learning Configuration - PAD-UFES-20
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode federated --config configs/dscatnet_federated_padufes20.yaml
#
# Description:
#   Federated learning experiment on PAD-UFES-20 dataset (Brazilian clinical
#   skin lesion images). Uses natural non-IID with IID data partitioning.
#
# =============================================================================

federated:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: dscatnet_federated_padufes20
    description: "FL benchmark on PAD-UFES-20 with FedAvg"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs
  datasets:
    - PAD-UFES-20

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: small
    image_size: 224
    num_classes: 7
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 8       # Physical batch size (fits 4GB VRAM)
    gradient_accumulation_steps: 4  # Effective batch size = 8 * 4 = 32 (matches paper)
    optimizer: adam      # Adam optimizer (matches DSCATNet paper)
    lr: 0.001           # Learning rate (matches DSCATNet paper)
    weight_decay: 0.0   # No weight decay (matches DSCATNet paper's Adam)
    local_epochs: 1     # Local epochs per FL round (1 reduces client drift)
    num_rounds: 100
    train_val_split: 0.85  # 85% for training, 15% for validation

  # ---------------------------------------------------------------------------
  # Federation Configuration
  # ---------------------------------------------------------------------------
  federation:
    num_clients: 4
    aggregation: FedAvg
    participation: 1.0
    
    # Client Selection (alternative to participation)
    # client_selection_fraction: 0.75  # Randomly select 75% of clients per round
    
    # Parallel client training (for multi-GPU or fast CPUs)
    # parallel_clients: 2  # Number of clients to train in parallel
    
    noniid_type: dirichlet
    dirichlet_alpha: 0.5

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 1
    early_stopping_patience: 10
    use_class_weights: true  # Handle class imbalance (matches centralized trainer)
