# =============================================================================
# DSCATNet Centralized Training Configuration - ISIC2020
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode centralized --config configs/dscatnet_centralized_isic2020.yaml
#
# Description:
#   Centralized training on ISIC2020 (~33,126 dermoscopy images, 7 classes).
#
# =============================================================================

centralized:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: dscatnet_centralized_isic2020
    description: "Centralized training on ISIC2020"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs
  datasets:
    - ISIC2020

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: paper  # Paper-faithful: embed_dim=384, depth=6, H=12 heads
    image_size: 224
    num_classes: 7
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 8
    gradient_accumulation_steps: 4  # Effective batch = 8 × 4 = 32
    optimizer: adam
    lr: 0.001
    weight_decay: 0.0
    epochs: 200
    warmup_epochs: 0
    scheduler: none
    min_lr: 0.000001
    use_amp: false

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Data Splits
  # ---------------------------------------------------------------------------
  splits:
    val_split: 0.15
    test_split: 0.15

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 5
    early_stopping_patience: 200
    use_class_weights: false
    max_grad_norm: null
