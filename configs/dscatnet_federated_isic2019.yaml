# =============================================================================
# DSCATNet Federated Learning Configuration - ISIC2019
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode federated --config configs/dscatnet_federated_isic2019.yaml
#
# Description:
#   Federated learning experiment on ISIC2019 dataset with Dirichlet-based
#   non-IID data distribution. ISIC2019 uses 8 classes (adds SCC to the
#   standard 7). Hyperparameters match the HAM10000 federated benchmark.
#
# =============================================================================

federated:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: dscatnet_federated_isic2019
    description: "FL benchmark on ISIC2019 with FedAvg"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs
  datasets:
    - ISIC2019

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: small
    image_size: 224
    num_classes: 7      # Use 7 for standard mapping; change to 8 to include SCC
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 8       # Physical batch size (fits 4GB VRAM)
    gradient_accumulation_steps: 4  # Effective batch size = 8 * 4 = 32 (matches paper)
    optimizer: adam      # Adam optimizer (matches DSCATNet paper)
    lr: 0.001           # Learning rate (matches DSCATNet paper)
    weight_decay: 0.0   # No weight decay (matches DSCATNet paper's Adam)
    local_epochs: 1     # Local epochs per FL round (1 reduces client drift)
    num_rounds: 100
    train_val_split: 0.85  # 85% for training, 15% for validation

  # ---------------------------------------------------------------------------
  # Federation Configuration
  # ---------------------------------------------------------------------------
  federation:
    num_clients: 4
    aggregation: FedAvg
    participation: 1.0
    noniid_type: dirichlet
    dirichlet_alpha: 0.5

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 1
    early_stopping_patience: 10
