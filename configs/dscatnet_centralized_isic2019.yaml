# =============================================================================
# DSCATNet Centralized Training Configuration - ISIC2019
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode centralized --config configs/dscatnet_centralized_isic2019.yaml
#
# Description:
#   Centralized training on ISIC2019 (~25,331 dermoscopy images, 8 classes
#   including SCC; mapped to 7 by default).
#
# =============================================================================

centralized:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: dscatnet_centralized_isic2019
    description: "Centralized training on ISIC2019"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs
  datasets:
    - ISIC2019

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: small
    image_size: 224
    num_classes: 7      # Use 7 for standard mapping; change to 8 to include SCC
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 8
    gradient_accumulation_steps: 4  # Effective batch = 8 × 4 = 32
    optimizer: adam
    lr: 0.001
    weight_decay: 0.0
    epochs: 200
    warmup_epochs: 0
    scheduler: none
    min_lr: 0.000001
    use_amp: false

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Data Splits
  # ---------------------------------------------------------------------------
  splits:
    val_split: 0.15
    test_split: 0.15

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 5
    early_stopping_patience: 15
    use_class_weights: true
