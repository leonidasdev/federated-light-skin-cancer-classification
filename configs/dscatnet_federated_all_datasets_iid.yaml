# =============================================================================
# DSCATNet Federated Learning Configuration - All Datasets (IID)
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode federated --config configs/dscatnet_federated_all_datasets_iid.yaml
#
# Description:
#   Federated learning on all datasets combined with true IID (pooled) distribution
#
# =============================================================================

federated:
  experiment:
    name: dscatnet_federated_all_datasets_iid
    description: FL training on all datasets (ISIC2018, ISIC2019, ISIC2020, PAD-UFES-20)
      with FedAvg (IID)
  data_root: ./data
  output_dir: ./outputs
  datasets:
  - ISIC2018
  - ISIC2019
  - ISIC2020
  - PAD-UFES-20
  model:
    name: DSCATNet
    variant: paper
    image_size: 224
    num_classes: 7
    pretrained: true
  training:
    batch_size: 4
    gradient_accumulation_steps: 8
    optimizer: adam
    lr: 0.001
    weight_decay: 0.0
    local_epochs: 1
    num_rounds: 100
    train_val_split: 0.85
  federation:
    num_clients: 4
    aggregation: FedAvg
    participation: 1.0
    data_partition_type: iid     # True IID: pooled random split
  augmentation:
    level: light
    use_dermoscopy_norm: false
  evaluation:
    checkpoint_interval: 1
    early_stopping_patience: 100
    use_class_weights: false
    max_grad_norm: null
