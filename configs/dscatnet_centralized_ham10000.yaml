# =============================================================================
# DSCATNet Centralized Training Configuration - HAM10000
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode centralized --config configs/dscatnet_centralized_ham10000.yaml
#
# Description:
#   Centralized (non-federated) training baseline on HAM10000 for direct
#   comparison with the federated experiment (dscatnet_federated_ham10000.yaml).
#   Serves as the upper-bound performance baseline with pooled data.
#
# =============================================================================

centralized:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: dscatnet_centralized_ham10000
    description: "Centralized baseline training on HAM10000"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs

  # Same dataset as federated experiment
  datasets:
    - HAM10000

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: small      # tiny (~5M), small (~29.4M), base (~39M)
    image_size: 224
    num_classes: 7
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 8       # Physical batch size (fits 4GB VRAM)
    gradient_accumulation_steps: 4  # Effective batch size = 8 * 4 = 32 (matches paper)
    optimizer: adam      # Adam optimizer (matches DSCATNet paper)
    lr: 0.001           # Learning rate (matches DSCATNet paper)
    weight_decay: 0.0   # No weight decay (matches DSCATNet paper's Adam)
    epochs: 200         # Max epochs (paper trains ~200 epochs)
    warmup_epochs: 0
    scheduler: none     # No scheduler (matches DSCATNet paper)
    min_lr: 0.000001
    use_amp: false      # AMP disabled to avoid NaN instability

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Data Splits
  # ---------------------------------------------------------------------------
  splits:
    val_split: 0.15     # 15% for validation
    test_split: 0.15    # 15% for testing

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 5
    early_stopping_patience: 15
    use_class_weights: true  # Handle class imbalance
