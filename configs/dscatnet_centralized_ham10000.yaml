# =============================================================================
# DSCATNet Centralized Training Configuration - HAM10000
# =============================================================================
#
# Usage:
#   python run_experiment.py --mode centralized --config configs/dscatnet_centralized_ham10000.yaml
#
# Description:
#   Centralized (non-federated) training baseline on HAM10000 for direct
#   comparison with the federated experiment (dscatnet_federated_ham10000.yaml).
#   Serves as the upper-bound performance baseline with pooled data.
#
# =============================================================================

centralized:
  # ---------------------------------------------------------------------------
  # Experiment Identification
  # ---------------------------------------------------------------------------
  experiment:
    name: dscatnet_centralized_ham10000
    description: "Centralized baseline training on HAM10000"

  # ---------------------------------------------------------------------------
  # Data Configuration
  # ---------------------------------------------------------------------------
  data_root: ./data
  output_dir: ./outputs

  # Same dataset as federated experiment
  datasets:
    - HAM10000

  # ---------------------------------------------------------------------------
  # Model Configuration
  # ---------------------------------------------------------------------------
  model:
    name: DSCATNet
    variant: small      # tiny (~5M), small (~15M), base (~20M)
    image_size: 224
    num_classes: 7
    pretrained: true

  # ---------------------------------------------------------------------------
  # Training Configuration
  # ---------------------------------------------------------------------------
  training:
    batch_size: 4
    lr: 0.001
    weight_decay: 0.01
    epochs: 100
    warmup_epochs: 0
    scheduler: cosine
    min_lr: 0.000001

  # ---------------------------------------------------------------------------
  # Augmentation Configuration
  # ---------------------------------------------------------------------------
  augmentation:
    level: none
    use_dermoscopy_norm: false

  # ---------------------------------------------------------------------------
  # Data Splits
  # ---------------------------------------------------------------------------
  splits:
    val_split: 0.15     # 15% for validation
    test_split: 0.15    # 15% for testing

  # ---------------------------------------------------------------------------
  # Evaluation & Checkpointing
  # ---------------------------------------------------------------------------
  evaluation:
    checkpoint_interval: 5
    early_stopping_patience: 15
    use_class_weights: true  # Handle class imbalance
