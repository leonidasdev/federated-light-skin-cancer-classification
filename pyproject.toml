# =============================================================================
# Project Configuration
# =============================================================================

[project]
name = "federated-skin-cancer-classification"
version = "0.1.0"
description = "Federated Learning for Skin Cancer Classification with DSCATNet"
readme = "README.md"
license = {text = "Apache License 2.0"}
authors = [
    {name = "Leonardo Chen"}
]
requires-python = ">=3.10"

# =============================================================================
# Ruff Configuration
# =============================================================================

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
    "C4",    # flake8-comprehensions
    "PERF",  # perflint
    "RUF",   # ruff-specific rules
    "PLC",   # pylint convention
    "PLE",   # pylint error
]
ignore = [
    "E501",   # line too long - handled by formatter
    "RUF012", # mutable class attribute - dataclass pattern
    "RUF022", # unsorted __all__ - deliberately grouped by category
    "RUF002", # ambiguous unicode in docstrings - intentional × symbol
    "RUF003", # ambiguous unicode in comments - intentional × symbol
    "RUF005", # collection concatenation - list + list is clear enough
    "B905",   # zip without strict= - not always needed
    "SIM102", # collapsible if - sometimes more readable when separate
    "SIM115", # open-file-with-context-handler - sometimes file must stay open
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = [
    "E402",  # module level import not at top - common in notebooks
]
"tests/*.py" = [
    "F401",    # unused imports - test fixtures may appear unused
    "PLC0415", # imports in test methods are intentional (isolation)
]
"run_experiment.py" = [
    "PLC0415", # lazy imports of heavy modules (torch, etc.)
]
"run_tests.py" = [
    "PLC0415", # lazy import of pytest
]
"src/data/download.py" = [
    "PLC0415", # lazy imports of shutil/subprocess/zipfile
]
"src/utils/logging_utils.py" = [
    "PLC0415", # lazy imports of numpy and tensorboard
]
"src/utils/helpers.py" = [
    "PLC0415", # conditional GradScaler import
]
"src/evaluation/visualization.py" = [
    "RUF059", # fig from plt.subplots() is standard matplotlib pattern
]

# =============================================================================
# Pytest Configuration
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

# =============================================================================
# Coverage Configuration
# =============================================================================

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/__pycache__/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
